[package]
name = "robigus-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.robigus]
path = "../robigus"

[dependencies.ubuntu-info-rust]
version = "0.3"

[[bin]]
name = "canonical_round_trip"
path = "fuzz_targets/canonical_round_trip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_arbitrary"
path = "fuzz_targets/parse_arbitrary.rs"
test = false
doc = false
bench = false

# Prevent this crate from interfering with the parent workspace.
[workspace]
members = ["."]