name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for non-ASCII filenames
        run: |
          if git -c core.quotepath=false ls-files | LC_ALL=C grep -q -P '[^\x20-\x7E]'; then
            echo "::error::Attempt to add non-ASCII file name(s):"
            git -c core.quotepath=false ls-files | LC_ALL=C grep -P '[^\x20-\x7E]'
            exit 1
          fi
          echo "All tracked filenames are valid ASCII."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting (cargo fmt)
        run: cargo fmt -- --check

      - name: Run clippy linter (cargo clippy)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # `fuzz/` is a detached workspace with its own Cargo.lock, so the
      # workspace-wide checks above do not cover it. `--locked` also fails the
      # build when fuzz/Cargo.lock goes stale after a robigus dependency change.
      - name: Check fuzz target formatting (cargo fmt)
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      - name: Lint fuzz targets (cargo clippy)
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

      - name: Check documentation (cargo doc)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

      - name: Build all targets (cargo build)
        run: cargo build --locked --all-targets --all-features

      - name: Run test suite (cargo test)
        run: cargo test --locked --all-targets --all-features

      - name: Security audit dependencies (cargo audit)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    name: MSRV (1.93.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check build on MSRV
        run: cargo check --locked --all-targets --all-features

      - name: Build test binaries on MSRV
        run: cargo test --locked --all-targets --all-features --no-run

  deny:
    name: Dependency policy (cargo deny)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check dependency licenses, bans, sources, and advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  sandbox:
    name: Unprivileged bubblewrap sandbox
    # An ephemeral GitHub-hosted VM provides sudo for package/policy setup;
    # the probe and tests themselves must run as the unprivileged runner user.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # Ubuntu's bubblewrap package may enable kernel.unprivileged_userns_clone
      # system-wide in its post-install step; this job assumes a disposable VM.
      - name: Install bubblewrap and AppArmor tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor libcap2-bin python3

      - name: Check unprivileged bubblewrap namespaces
        run: |
          test "$(id -u)" -ne 0 || { echo '::error::Sandbox job must not run as root'; exit 1; }
          test "$(awk '/^CapEff:/ {print $2}' /proc/self/status)" = 0000000000000000 || {
            echo '::error::Sandbox job must not have effective capabilities'; exit 1;
          }
          test -x /usr/bin/bwrap && test ! -u /usr/bin/bwrap && test ! -g /usr/bin/bwrap || {
            echo '::error::Expected an executable, non-setuid/non-setgid /usr/bin/bwrap'; exit 1;
          }
          capabilities=$(getcap /usr/bin/bwrap)
          test -z "$capabilities" || { echo "::error::Unexpected bwrap file capabilities: $capabilities"; exit 1; }
          /usr/bin/bwrap --version

          # Match the backend probe, including its mount, user, PID, network,
          # IPC and UTS namespaces and runtime mounts. Do not relax seccomp.
          probe_bwrap() {
            timeout 15 /usr/bin/bwrap \
              --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts \
              --die-with-parent --new-session \
              --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
              --proc /proc --dev /dev --tmpfs /tmp --json-status-fd 1 -- /usr/bin/true
          }
          if ! probe_bwrap; then
            # Ubuntu 24.04 may restrict unprivileged user namespaces via
            # AppArmor. On this disposable VM, allow them only for /usr/bin/bwrap,
            # rather than disabling the system-wide restriction. This profile is
            # otherwise unconfined and exposes userns kernel interfaces to bwrap.
            if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] &&
               [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == 1 ]]; then
              cat > "$RUNNER_TEMP/robigus-ci-bwrap.apparmor" <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile robigus-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
              sudo apparmor_parser -r "$RUNNER_TEMP/robigus-ci-bwrap.apparmor"
              probe_bwrap
            else
              echo '::error::Unprivileged bubblewrap namespace probe failed'
              exit 1
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run required sandbox integration tests
        env:
          ROB_REQUIRE_BWRAP: "1"
        run: cargo test --locked -p robigus --test sandbox

      # Keep the known isolation regression mandatory until the ignored marker
      # is removed with the fix. This intentionally fails while it is unfixed.
      - name: Run required Unix-socket isolation regression
        env:
          ROB_REQUIRE_BWRAP: "1"
        run: cargo test --locked -p robigus --test sandbox offline_cannot_connect_to_unix_socket_in_source -- --ignored --exact

  # Umbrella job for branch protection: point required status checks at this
  # single job instead of enumerating every job name.
  ci-pass:
    name: CI gate
    if: always()
    needs: [build-and-test, msrv, deny, sandbox]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to succeed
        run: |
          if [[ "${{ needs.build-and-test.result }}" != "success" ||
                "${{ needs.msrv.result }}" != "success" ||
                "${{ needs.deny.result }}" != "success" ||
                "${{ needs.sandbox.result }}" != "success" ]]; then
            exit 1
          fi
