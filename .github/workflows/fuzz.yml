name: Fuzz

on:
  schedule:
    # Nightly, shortly after 05:00 UTC.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz smoke tests (nightly)
    runs-on: ubuntu-latest
    # Each target is bounded via -max_total_time; this caps the whole job.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # cargo-fuzz builds with `-Zsanitizer`, which requires nightly.
      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Fuzz builds are large; do not cache the target directory.
          cache-targets: false

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz targets
        run: |
          if [ ! -d fuzz ]; then
            echo "No fuzz targets yet (land with WP-1.2/WP-1.3); nothing to fuzz."
            exit 0
          fi
          cargo fuzz build
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time=60
          done
