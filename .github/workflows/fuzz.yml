name: Fuzz

on:
  schedule:
    # Nightly, shortly after 05:00 UTC.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz smoke tests (nightly)
    runs-on: ubuntu-latest
    # Each target is bounded via -max_total_time; this caps the whole job.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # cargo-fuzz builds with `-Zsanitizer`, which requires nightly.
      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Fuzz builds are large; do not cache the target directory.
          cache-targets: false

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz targets
        run: |
          cargo fuzz build
          targets=$(cargo fuzz list)
          # Fail rather than pass vacuously if the targets disappear.
          test -n "$targets" || { echo '::error::No fuzz targets found'; exit 1; }
          for target in $targets; do
            echo "::group::Fuzzing $target"
            cargo fuzz run "$target" -- -max_total_time=60
            echo '::endgroup::'
          done

      # Crash inputs reproduce with `cargo fuzz run <target> <artifact>`.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
