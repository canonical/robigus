[package]
name = "robigus"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Dependency graph analysis for planning Ubuntu packaging of upstream software"
license = "GPL-3.0-only"
repository = "https://github.com/canonical/robigus"
keywords = ["ubuntu", "debian", "packaging", "dependencies", "cargo"]
categories = ["development-tools", "development-tools::build-utils"]

[[bin]]
name = "tsp-analyzer"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
async-trait = "0.1"
chrono = { workspace = true }
flate2 = { workspace = true }
gix = { workspace = true, features = ["blocking-http-transport-reqwest"] }
glob = { workspace = true }
ignore = { workspace = true }
miette = { workspace = true }
petgraph = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
rustix = { version = "1", features = ["process"] }
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror.workspace = true
tar = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml_edit = { workspace = true }
ubuntu-info-rust = { workspace = true }
url = { version = "2", features = ["serde"] }
walkdir = { workspace = true }
xz2 = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
wiremock = { workspace = true }
