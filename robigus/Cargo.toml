[package]
name = "robigus"
version = "0.1.0"
edition = "2024"
description = "Rust libraries and tools for packaging automation"
license = "GPL-3.0-or-later"
repository = "https://github.com/canonical/robigus"
keywords = "ubuntu, packaging, automation"
categories = "automation, ubuntu"
rust-version = "1.93"

[dependencies]
async-trait = "0.1.92"
semver = { version = "1.0.28", features = ["serde"] }
serde.workspace = true
thiserror.workspace = true
ubuntu-info-rust = { workspace = true }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
serde_json.workspace = true
