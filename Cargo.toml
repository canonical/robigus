[workspace]
# Resolver 3 adds MSRV-aware dependency resolution, keeping the lockfile
# compatible with the workspace's rust-version 1.93.1 (the default Rust
# toolchain on Ubuntu 26.04 LTS). The workspace has no edition key, so this
# must be stated explicitly.
resolver = "3"
members = [
    "rapt",
    "robigus"
]

[workspace.package]
rust-version = "1.93.1"

[workspace.dependencies]
# Shared dependencies (pre-existing)
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
regex = "1"
reqwest = { version = "0.13", features = ["default"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
ubuntu-info-rust = { version = "0.3", features = ["serde"] }
xz2 = "0.1"

# Shared dependencies (Phase 1) — declared once here; work packages wire them
# in via `.workspace = true`.
# Graph algorithms
petgraph = "0.8"
# SQLite persistence. rusqlite 0.40 is the newest major supported by both
# tokio-rusqlite 0.8 (^0.40.1) and rusqlite_migration 2.6 (^0.40.0); do not
# bump to 0.41 until those two follow.
rusqlite = { version = "0.40", features = ["bundled"] }
tokio-rusqlite = "0.8"
rusqlite_migration = "2.6"
# Observability and diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
miette = { version = "7", features = ["fancy"] }
# Acquisition, extraction, and file traversal
sha2 = "0.11"
tar = "0.4"
zstd = "0.14"
walkdir = "2"
ignore = "0.4"
# Git access and manifest/config parsing
gix = "0.90"
cargo_metadata = "0.23"
toml_edit = "0.25"
toml = "1"

# dev-dependencies
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["json", "redactions"] }
proptest = "1"
wiremock = "0.6"
