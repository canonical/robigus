[workspace]
# Resolver 3 adds MSRV-aware dependency resolution, keeping the lockfile
# compatible with the workspace's rust-version 1.93.1 (the default Rust
# toolchain on Ubuntu 26.04 LTS). The workspace has no edition key, so this
# must be stated explicitly.
resolver = "3"
members = [
    "rapt",
    "robigus"
]

[workspace.package]
rust-version = "1.93.1"

[workspace.dependencies]
# Shared dependencies (pre-existing)
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
regex = "1"
reqwest = { version = "0.13", features = ["default"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
ubuntu-info-rust = { version = "0.3", features = ["serde"] }
xz2 = "0.1"

# Shared dependencies (Phase 1) — declared once here; work packages wire them
# in via `.workspace = true`.
# Graph algorithms
petgraph = "0.8"
# SQLite persistence. rusqlite 0.39 pairs with rusqlite_migration 2.5.0, the
# newest migration crate whose rust-version (1.84) satisfies the workspace
# MSRV (1.93.1); rusqlite_migration 2.6.0 requires rustc 1.95. tokio-rusqlite
# is unused: the store drives a shared Arc<Mutex<rusqlite::Connection>> via
# spawn_blocking (spec §11.1). Turso was evaluated and rejected for v1 —
# turso-migrate pins turso 0.4.x (no CHECK/FK enforcement), and turso 0.8.x
# does not enforce partial unique indexes (spec §22.15).
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "2.5"
tokio-rusqlite = "0.8"
# Observability and diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
miette = { version = "7", features = ["fancy"] }
# Acquisition, extraction, and file traversal
sha2 = "0.11"
tar = "0.4"
zstd = "0.14"
walkdir = "2"
ignore = "0.4"
# Git access and manifest/config parsing
gix = "0.90"
cargo_metadata = "0.23"
glob = "0.3"
toml_edit = "0.25"
toml = "1"

# dev-dependencies
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["json", "redactions"] }
proptest = "1"
wiremock = "0.6"
