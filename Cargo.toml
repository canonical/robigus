[workspace]
resolver = "2"
members = [
    "rapt",
    "robigus"
]

[workspace.dependencies]
# standard dependencies
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
regex = "1"
reqwest = { version = "0.13", features = ["default"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
ubuntu-info-rust = { version = "0.3", features = ["serde"] }
xz2 = "0.1"

# dev-dependencies
assert_cmd = "2"
predicates = "3"
tempfile = "3"
